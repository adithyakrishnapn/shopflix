services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopflix-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "10000"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: base64:ZyglX2iNJYdilwyoyegzP/5mgXyXC8b7zqHK0hd7Fy4=
      APP_URL: http://localhost:8080
      ASSET_URL: http://localhost:8080
      APP_FORCE_HTTPS: "false"
      LOG_CHANNEL: stderr

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: shopflix
      DB_USERNAME: shopflix
      DB_PASSWORD: shopflix
      DB_SSLMODE: disable

      BAGISTO_INSTALLATION_TYPE: cream
      BAGISTO_SEED_BASE_DATA: "true"
      FORCE_FRESH_INSTALL: "false"
    ports:
      - "8080:10000"
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: shopflix-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shopflix
      MYSQL_USER: shopflix
      MYSQL_PASSWORD: shopflix
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
