services:
  - type: web
    name: shopflix-backend
    env: docker
    plan: free # Change to pro if needed
    dockerCommand: ./scripts/deploy.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          name: shopflix-db
          type: mysql
          property: host
      - key: DB_PORT
        fromService:
          name: shopflix-db
          type: mysql
          property: port
      - key: DB_DATABASE
        fromService:
          name: shopflix-db
          type: mysql
          property: database
      - key: DB_USERNAME
        fromService:
          name: shopflix-db
          type: mysql
          property: user
      - key: DB_PASSWORD
        fromService:
          name: shopflix-db
          type: mysql
          property: password

  - type: mysql
    name: shopflix-db
    plan: free # Change to pro for persistent storage
    databaseName: shopflix
    user: shopflix_user
