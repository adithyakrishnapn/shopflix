envVarGroups:
  - name: shopflix-shared
    envVars:
      - key: DB_DATABASE
        value: shopflix
      - key: DB_USERNAME
        value: shopflix_user
      - key: DB_PASSWORD
        generateValue: true

services:
  - type: web
    name: shopflix-backend
    env: docker
    plan: free # Change to pro if needed
    dockerCommand: ./scripts/deploy.sh
    envVars:
      - fromGroup: shopflix-shared
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: shopflix-db
      - key: DB_PORT
        value: "3306"

  - type: pserv
    name: shopflix-db
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: Dockerfile.mysql
    dockerCommand: sh -c "export MYSQL_DATABASE=$DB_DATABASE; export MYSQL_USER=$DB_USERNAME; export MYSQL_PASSWORD=$DB_PASSWORD; export MYSQL_ROOT_PASSWORD=$DB_PASSWORD; exec docker-entrypoint.sh mysqld"
    envVars:
      - fromGroup: shopflix-shared


