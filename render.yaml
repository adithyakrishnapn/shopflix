services:
  - type: web
    name: shopflix-backend
    env: docker
    plan: free
    dockerCommand: ./scripts/deploy.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: "" # PROVIDE EXTERNAL DB HOST
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: "" # PROVIDE EXTERNAL DB NAME
      - key: DB_USERNAME
        value: "" # PROVIDE EXTERNAL DB USER
      - key: DB_PASSWORD
        value: "" # PROVIDE EXTERNAL DB PASSWORD



