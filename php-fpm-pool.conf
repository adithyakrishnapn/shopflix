[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

; Use dynamic process management
pm = dynamic

; Render free plan has 512MB RAM.
; Each PHP-FPM worker uses ~20-40MB.
; 15 workers = up to ~600MB, but in practice only a few run at once.
pm.max_children = 15
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Raise request timeout — product edit page can take a few seconds to render
request_terminate_timeout = 120

; Log slow requests (anything over 10s)
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s

; Pass error output to stderr (captured by Render logs)
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Raise memory limit per worker
php_admin_value[memory_limit] = 256M
